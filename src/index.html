    const sprintScopeNote = document.createElement('div'); sprintScopeNote.className = 'sprint-scope-print-note';
    header.appendChild(sprintScopeNote);

    const progressLine = document.createElement('div'); progressLine.className = 'progress-line';
    const track = document.createElement('div'); track.className = 'progress-track';
    const fill = document.createElement('div'); fill.className = 'progress-fill'; fill.style.width = '0%';
    track.appendChild(fill);
    const caption = document.createElement('div'); caption.className = 'progress-caption';
    const countEl = document.createElement('span'); countEl.className = 'progress-count';
    const pctEl = document.createElement('span'); pctEl.className = 'progress-percent';
    caption.appendChild(countEl); caption.appendChild(pctEl);
    progressLine.appendChild(track); progressLine.appendChild(caption);
    header.appendChild(progressLine);
    panel.appendChild(header);

    function updateProgress() {
      const total = ws.items.length;
      const doneCount = ws.items.filter(i => i.done).length;
      const pct = total === 0 ? 0 : Math.round((doneCount / total) * 100);
      fill.style.width = pct + '%';
      countEl.textContent = doneCount + ' of ' + total + ' complete';
      pctEl.textContent = pct + '%';
    }

    // ---- add card ----
    const addCard = document.createElement('div'); addCard.className = 'add-card';
    const addRow = document.createElement('div'); addRow.className = 'add-row';

    const titleInput = document.createElement('input');
    titleInput.type = 'text'; titleInput.className = 'title-input';
    titleInput.placeholder = labels.newItemPlaceholder || 'Add a task…';
    titleInput.maxLength = 200; titleInput.autocomplete = 'off';
    bindPlaceholderEdit(titleInput, 'newItemPlaceholder');

    const dateWrap = document.createElement('span'); dateWrap.className = 'date-edit-wrap';
    const dateInput = document.createElement('input');
    dateInput.type = 'text'; dateInput.className = 'date-input date-mask-input';
    dateInput.placeholder = labels.newItemDatePlaceholder || 'DD-MM-YYYY';
    dateInput.inputMode = 'numeric'; dateInput.maxLength = 10; dateInput.autocomplete = 'off';
    dateInput.addEventListener('input', () => maskDateInput(dateInput));
    bindPlaceholderEdit(dateInput, 'newItemDatePlaceholder');
    const calBtn = document.createElement('button');
    calBtn.type = 'button'; calBtn.className = 'cal-btn'; calBtn.setAttribute('aria-label', 'Choose date from calendar');
    calBtn.innerHTML = calendarSvg();
    const nativeDate = document.createElement('input');
    nativeDate.type = 'date'; nativeDate.className = 'native-date-hidden'; nativeDate.tabIndex = -1;
    nativeDate.setAttribute('aria-hidden', 'true');
    calBtn.addEventListener('mousedown', e => e.preventDefault());
    calBtn.addEventListener('click', e => {
      e.preventDefault();
      openCalendarPopover(calBtn, nativeDate.value || null, iso => { nativeDate.value = iso; nativeDate.dispatchEvent(new Event('change')); });
    });
    nativeDate.addEventListener('change', () => { if (nativeDate.value) { dateInput.value = isoToDMY(nativeDate.value); } });
    dateWrap.appendChild(dateInput); dateWrap.appendChild(calBtn); dateWrap.appendChild(nativeDate);

    const prioritySelect = document.createElement('select');
    prioritySelect.className = 'priority-select styled-select'; prioritySelect.setAttribute('data-val', '');
    [['', 'No priority'], ['low', 'Low'], ['medium', 'Medium'], ['high', 'High']].forEach(pair => {
      const opt = document.createElement('option'); opt.value = pair[0]; opt.textContent = pair[1];
      prioritySelect.appendChild(opt);
    });
    prioritySelect.addEventListener('change', function () { this.setAttribute('data-val', this.value); });

    const addBtn = document.createElement('button'); addBtn.type = 'button'; addBtn.className = 'primary';
    const addBtnLabel = document.createElement('span');
    addBtnLabel.className = 'editable'; addBtnLabel.setAttribute('data-key', 'addBtnLabel'); addBtnLabel.contentEditable = 'false';
    addBtnLabel.textContent = labels.addBtnLabel;
    bindEditable(addBtnLabel);
    addBtn.appendChild(addBtnLabel);

    function doAddItem() {
      if (customizing) return;
      const title = titleInput.value.trim();
      if (!title) { titleInput.focus(); return; }
      let due = null;
      if (dateInput.value.trim()) {
        due = dmyToIso(dateInput.value.trim());
        if (!due) { dateInput.classList.add('invalid'); setTimeout(() => dateInput.classList.remove('invalid'), 900); }
      }
      ws.items.push({
        id: uid(), title: title, due: due, priority: prioritySelect.value || null, done: false,
        completedDate: null, subs: [], createdAt: Date.now(),
        status: 'todo', storyPoints: null, sprintId: ws.activeSprintId !== 'all' && ws.activeSprintId !== 'backlog' ? ws.activeSprintId : null
      });
      saveWorkspaces();
      logActivity('task', 'Added "' + title + '"', ws.name);
      titleInput.value = ''; dateInput.value = ''; prioritySelect.value = ''; prioritySelect.setAttribute('data-val', ''); nativeDate.value = '';
      titleInput.focus();
      renderList(); renderOverview();
    }
    addBtn.addEventListener('click', doAddItem);
    titleInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !customizing) doAddItem(); });

    addRow.appendChild(titleInput); addRow.appendChild(dateWrap); addRow.appendChild(prioritySelect); addRow.appendChild(addBtn);
    addCard.appendChild(addRow);
    panel.appendChild(addCard);

    // ---- search ----
    const searchRow = document.createElement('div'); searchRow.className = 'search-row';
    const searchInput = document.createElement('input');
    searchInput.type = 'text'; searchInput.className = 'search-input'; searchInput.placeholder = 'Filter tasks…'; searchInput.autocomplete = 'off';
    searchInput.addEventListener('input', () => { searchQuery = searchInput.value.trim().toLowerCase(); renderList(); });
    searchRow.appendChild(searchInput);
    panel.appendChild(searchRow);

    // ---- filters ----
    const filterRow = document.createElement('div'); filterRow.className = 'filter-row';

    function buildFilterChips(options, getValue, setValue) {
      const group = document.createElement('div'); group.className = 'filter-group';
      const buttons = [];
      options.forEach(pair => {
        const val = pair[0], label = pair[1];
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'chip-btn filter-chip';
        btn.textContent = label;
        if (getValue() === val) btn.classList.add('active');
        btn.addEventListener('click', () => {
          setValue(val);
          buttons.forEach(b => b.classList.toggle('active', b === btn));
          renderList();
        });
        buttons.push(btn);
        group.appendChild(btn);
      });
      return group;
    }

    filterRow.appendChild(buildFilterChips(
      [['', 'All priorities'], ['high', 'High'], ['medium', 'Medium'], ['low', 'Low'], ['none', 'No priority']],
      () => priorityFilter, v => { priorityFilter = v; }
    ));
    filterRow.appendChild(buildFilterChips(
      [['', 'All dates'], ['today', 'Today'], ['week', 'This week'], ['later', 'Later'], ['none', 'No date']],
      () => dateFilter, v => { dateFilter = v; }
    ));
    panel.appendChild(filterRow);

    // ---- view toggle + sprint bar ----
    const viewSprintRow = document.createElement('div'); viewSprintRow.className = 'view-sprint-row';
    const viewToggle = document.createElement('div'); viewToggle.className = 'view-toggle';
    const listViewBtn = document.createElement('button'); listViewBtn.type = 'button'; listViewBtn.className = 'chip-btn view-btn'; listViewBtn.textContent = 'List';
    const boardViewBtn = document.createElement('button'); boardViewBtn.type = 'button'; boardViewBtn.className = 'chip-btn view-btn'; boardViewBtn.textContent = 'Board';
    function updateViewButtons() {
      listViewBtn.classList.toggle('active', ws.view === 'list');
      boardViewBtn.classList.toggle('active', ws.view === 'board');
      panel.classList.toggle('showing-board', ws.view === 'board');
    }
    listViewBtn.addEventListener('click', () => { ws.view = 'list'; saveWorkspaces(); updateViewButtons(); });
    boardViewBtn.addEventListener('click', () => { ws.view = 'board'; saveWorkspaces(); updateViewButtons(); });
    viewToggle.appendChild(listViewBtn); viewToggle.appendChild(boardViewBtn);

    const sprintBar = document.createElement('div'); sprintBar.className = 'sprint-bar';
    function renderSprintBar() {
      sprintBar.innerHTML = '';
      const sel = document.createElement('select'); sel.className = 'sprint-select styled-select';
      sel.title = 'Show only tasks in the selected sprint (or Backlog for unassigned tasks, or All tasks for everything).';
      [['all', 'All tasks'], ['backlog', 'Backlog']].concat(ws.sprints.map(s => [s.id, s.name])).forEach(pair => {
        const opt = document.createElement('option'); opt.value = pair[0]; opt.textContent = pair[1];
        if (ws.activeSprintId === pair[0]) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', () => { ws.activeSprintId = sel.value; saveWorkspaces(); renderSprintBar(); renderList(); });
      sprintBar.appendChild(sel);

      const activeSprint = ws.sprints.find(s => s.id === ws.activeSprintId);
      sprintScopeNote.textContent = activeSprint ? 'Sprint: ' + activeSprint.name
        : ws.activeSprintId === 'backlog' ? 'Backlog (no sprint)' : '';
      if (activeSprint) {
        const info = document.createElement('span'); info.className = 'sprint-info';
        let text = '';
        if (activeSprint.startDate || activeSprint.endDate) {
          text += (activeSprint.startDate ? isoToDMY(activeSprint.startDate) : '?') + ' – ' + (activeSprint.endDate ? isoToDMY(activeSprint.endDate) : '?');
        }
        if (activeSprint.goal) text += (text ? ' · ' : '') + activeSprint.goal;
        info.textContent = text;
        sprintBar.appendChild(info);
      }

      if (ws.sprints.length > 0) {
        const manageBtn = document.createElement('button'); manageBtn.type = 'button'; manageBtn.className = 'chip-btn';
        manageBtn.textContent = 'Manage sprints';
        manageBtn.title = 'Rename or delete sprints.';
        manageBtn.addEventListener('click', () => openSprintManageModal(ws, () => { renderSprintBar(); renderList(); }));
        sprintBar.appendChild(manageBtn);
      }

      const newBtn = document.createElement('button'); newBtn.type = 'button'; newBtn.className = 'chip-btn'; newBtn.textContent = '+ New sprint';
      newBtn.addEventListener('click', () => openSprintModal(ws, null, () => { renderSprintBar(); renderList(); }));
      sprintBar.appendChild(newBtn);
    }
    renderSprintBar();
    updateViewButtons();

    viewSprintRow.appendChild(viewToggle); viewSprintRow.appendChild(sprintBar);
    panel.appendChild(viewSprintRow);

    // ---- list ----
    const listContainer = document.createElement('div'); listContainer.className = 'panel-list';
    panel.appendChild(listContainer);

    // ---- board ----
    const boardContainer = document.createElement('div'); boardContainer.className = 'board-container';
    panel.appendChild(boardContainer);
    let dragCardItem = null;

    function buildStoryPointsControl(item) {
      if (item._editingPoints) {
        const input = document.createElement('input');
        input.type = 'number'; input.min = '0'; input.max = '999'; input.step = '1'; input.className = 'points-input';
        input.value = item.storyPoints != null ? item.storyPoints : '';
        input.placeholder = 'pts';
        input.style.width = '48px'; input.style.fontSize = '11px'; input.style.padding = '2px 5px';
        input.style.border = '1px solid var(--line)'; input.style.borderRadius = '6px'; input.style.background = 'var(--surface)'; input.style.color = 'var(--ink)';
        const commit = () => {
          const raw = input.value.trim();
          const before = item.storyPoints;
          item.storyPoints = raw === '' ? null : Math.max(0, parseInt(raw, 10) || 0);
          item._editingPoints = false;
          saveWorkspaces(); renderList(); renderOverview();
          if (item.storyPoints !== before) logActivity('task', 'Set points of "' + item.title + '" to ' + (item.storyPoints != null ? item.storyPoints : 'none'), ws.name);
        };
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
          if (e.key === 'Escape') { item._editingPoints = false; renderList(); }
        });
        setTimeout(() => { input.focus(); input.select(); }, 0);
        return input;
      }
      const span = document.createElement('span'); span.className = 'board-card-points';
      span.style.cursor = 'pointer';
      if (item.storyPoints) { span.textContent = item.storyPoints + ' pts'; }
      else { span.textContent = 'Add points'; span.style.opacity = '0.55'; span.style.background = 'none'; span.style.color = 'var(--ink-soft)'; }
      span.addEventListener('click', () => { item._editingPoints = true; renderList(); });
      return span;
    }

    function buildSprintSelectFor(entity) {
      const sel = document.createElement('select'); sel.className = 'sprint-assign-select styled-select';
      sel.title = 'Assign this task to a sprint, or leave it in the Backlog.';
      sel.style.fontSize = '11px'; sel.style.border = 'none'; sel.style.backgroundColor = 'transparent'; sel.style.color = 'var(--ink-soft)'; sel.style.font = 'inherit';
      [['', 'Backlog']].concat(ws.sprints.map(s => [s.id, s.name])).forEach(pair => {
        const opt = document.createElement('option'); opt.value = pair[0]; opt.textContent = pair[1];
        if ((entity.sprintId || '') === pair[0]) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', () => {
        entity.sprintId = sel.value || null; saveWorkspaces(); renderList();
        const sprintName = entity.sprintId ? (ws.sprints.find(s => s.id === entity.sprintId) || {}).name : null;
        logActivity('task', 'Assigned "' + entity.title + '" to ' + (sprintName || 'Backlog'), ws.name);
      });
      return sel;
    }

    // Moves `draggedItem` into `status`'s column, positioned right before/after `targetItem`
    // (or appended to the end of the column if `targetItem` is null — dropped on empty space).
    function commitBoardDrop(draggedItem, status, targetItem, insertBefore) {
      const prevStatus = draggedItem.status;
      draggedItem.status = status;
      if (status === 'done') { draggedItem.done = true; if (!draggedItem.completedDate) draggedItem.completedDate = todayIso(); }
      else { draggedItem.done = false; draggedItem.completedDate = null; }
      const absFrom = ws.items.indexOf(draggedItem);
      if (absFrom !== -1) ws.items.splice(absFrom, 1);
      if (targetItem && targetItem !== draggedItem) {
        const absTarget = ws.items.indexOf(targetItem);
        ws.items.splice(insertBefore ? absTarget : absTarget + 1, 0, draggedItem);
      } else {
        ws.items.push(draggedItem);
      }
      saveWorkspaces(); renderList(); renderOverview();
      if (prevStatus !== status) {
        logActivity('task', 'Moved "' + draggedItem.title + '" to ' + labels[STATUS_LABEL_KEY[status]], ws.name);
      }
    }

    function buildBoardCard(item) {
      const card = document.createElement('div'); card.className = 'board-card'; card.draggable = true;
      card.addEventListener('dragstart', e => {
        dragCardItem = item;
        card.classList.add('dragging');
        // WebKitGTK needs dataTransfer actually populated (unlike Chromium) for the drop to register.
        if (e.dataTransfer) {
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', item.id); } catch (err) {}
        }
      });
      card.addEventListener('dragend', () => { dragCardItem = null; card.classList.remove('dragging'); });
      card.addEventListener('dragover', e => {
        e.preventDefault(); e.stopPropagation();
        if (!dragCardItem || dragCardItem === item) return;
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
        const before = (e.clientY - card.getBoundingClientRect().top) < card.getBoundingClientRect().height / 2;
        card.classList.toggle('drop-before', before);
        card.classList.toggle('drop-after', !before);
      });
      card.addEventListener('dragleave', () => { card.classList.remove('drop-before', 'drop-after'); });
      card.addEventListener('drop', e => {
        e.preventDefault(); e.stopPropagation();
        const before = card.classList.contains('drop-before');
        card.classList.remove('drop-before', 'drop-after');
        if (!dragCardItem || dragCardItem === item) return;
        commitBoardDrop(dragCardItem, item.status, item, before);
      });

      const del = document.createElement('button');
      del.className = 'board-card-delete'; del.setAttribute('aria-label', 'Delete task'); del.textContent = '×';
      del.setAttribute('draggable', 'false');
      del.addEventListener('mousedown', e => e.stopPropagation());
      del.addEventListener('click', () => requestDelete('Delete "' + item.title + '"?', () => deleteItemNow(item)));
      card.appendChild(del);

      const title = document.createElement('div');
      title.className = 'board-card-title' + (item.done ? ' done' : '');
      title.contentEditable = 'true';
      title.setAttribute('draggable', 'false');
      title.textContent = item.title;
      title.addEventListener('blur', () => {
        const oldTitle = item.title;
        item.title = title.textContent.trim() || item.title; title.textContent = item.title; saveWorkspaces(); renderOverview();
        if (item.title !== oldTitle) logActivity('text', 'Renamed "' + oldTitle + '" to "' + item.title + '"', ws.name);
      });
      bindEnterToBlur(title); bindPasteAsPlainText(title);
      card.appendChild(title);

      const meta = document.createElement('div'); meta.className = 'board-card-meta';
      meta.appendChild(buildDateControl(item, 'due', '_editingDue', 'Due ', true, 'Set due date', 'No due date'));
      meta.appendChild(buildPrioritySelectFor(item, true));
      meta.appendChild(buildStoryPointsControl(item));
      if (ws.sprints.length > 0) meta.appendChild(buildSprintSelectFor(item));
      card.appendChild(meta);
      return card;
    }

    function renderBoard() {
      boardContainer.innerHTML = '';
      const query = searchQuery;
      let source = ws.items;
      if (query) source = source.filter(i => i.title.toLowerCase().includes(query));
      if (priorityFilter) source = source.filter(i => priorityFilter === 'none' ? !i.priority : i.priority === priorityFilter);
      if (dateFilter) source = source.filter(i => computeBucket(i.due) === dateFilter);
      if (ws.activeSprintId === 'backlog') source = source.filter(i => !i.sprintId);
      else if (ws.activeSprintId !== 'all') source = source.filter(i => i.sprintId === ws.activeSprintId);

      const columnsWrap = document.createElement('div'); columnsWrap.className = 'board-columns';
      STATUSES.forEach(status => {
        const col = document.createElement('div'); col.className = 'board-column';
        const header = document.createElement('div'); header.className = 'board-column-header';
        const title = document.createElement('span');
        title.className = 'editable'; title.setAttribute('data-key', STATUS_LABEL_KEY[status]); title.contentEditable = 'false';
        title.textContent = labels[STATUS_LABEL_KEY[status]];
        bindEditable(title);
        const colItems = source.filter(i => i.status === status);
        const points = colItems.reduce((sum, i) => sum + (i.storyPoints || 0), 0);
        const pointsSpan = document.createElement('span'); pointsSpan.className = 'board-column-points';
        pointsSpan.textContent = colItems.length + (points ? ' · ' + points + ' pts' : '');
        header.appendChild(title); header.appendChild(pointsSpan);
        col.appendChild(header);

        const cardsWrap = document.createElement('div'); cardsWrap.className = 'board-cards';
        cardsWrap.addEventListener('dragover', e => {
          e.preventDefault();
          if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
          cardsWrap.classList.add('drag-over');
        });
        cardsWrap.addEventListener('dragleave', () => cardsWrap.classList.remove('drag-over'));
        cardsWrap.addEventListener('drop', e => {
          e.preventDefault();
          cardsWrap.classList.remove('drag-over');
          if (!dragCardItem) return;
          commitBoardDrop(dragCardItem, status, null, false);
        });

        if (colItems.length === 0) {
          const hint = document.createElement('div'); hint.className = 'board-empty-hint'; hint.textContent = 'No tasks';
          cardsWrap.appendChild(hint);
        }
        colItems.forEach(item => cardsWrap.appendChild(buildBoardCard(item)));
        col.appendChild(cardsWrap);
        columnsWrap.appendChild(col);
      });
      boardContainer.appendChild(columnsWrap);
    }

    function buildDateControl(entity, field, editFlag, prefixLabel, showOverdue, emptyLabel, printEmptyLabel) {
      if (entity[editFlag]) {
        const wrapper = document.createElement('span'); wrapper.className = 'date-edit-wrap';
        const input = document.createElement('input');
        input.type = 'text'; input.className = 'date-input date-mask-input'; input.placeholder = 'DD-MM-YYYY';
        input.inputMode = 'numeric'; input.maxLength = 10; input.style.fontSize = '12.5px'; input.style.padding = '4px 7px';
        input.value = isoToDMY(entity[field]);
        input.addEventListener('input', () => maskDateInput(input));
        const commit = () => {
          if (!entity[editFlag]) return;
          const raw = input.value.trim();
          if (raw === '') {
            entity[field] = null; entity[editFlag] = false; saveWorkspaces(); renderList(); renderOverview();
            if (field === 'due') logActivity('task', 'Cleared due date of "' + entity.title + '"', ws.name);
            return;
          }
          const iso = dmyToIso(raw);
          if (iso) {
            entity[field] = iso; entity[editFlag] = false; saveWorkspaces(); renderList(); renderOverview();
            if (field === 'due') logActivity('task', 'Set due date of "' + entity.title + '" to ' + isoToDMY(iso), ws.name);
          }
          else { input.classList.add('invalid'); setTimeout(() => { entity[editFlag] = false; renderList(); }, 900); }
        };
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); commit(); }
          if (e.key === 'Escape') { entity[editFlag] = false; renderList(); }
        });
        const hiddenNative = document.createElement('input');
        hiddenNative.type = 'date'; hiddenNative.className = 'native-date-hidden'; hiddenNative.tabIndex = -1;
        hiddenNative.setAttribute('aria-hidden', 'true');
        if (entity[field]) hiddenNative.value = entity[field];
        hiddenNative.addEventListener('change', () => {
          if (!entity[editFlag]) return;
          if (hiddenNative.value) {
            entity[field] = hiddenNative.value; entity[editFlag] = false; saveWorkspaces(); renderList(); renderOverview();
            if (field === 'due') logActivity('task', 'Set due date of "' + entity.title + '" to ' + isoToDMY(hiddenNative.value), ws.name);
          }
        });
        const calBtn2 = document.createElement('button');
        calBtn2.type = 'button'; calBtn2.className = 'cal-btn'; calBtn2.setAttribute('aria-label', 'Choose date from calendar');
        calBtn2.innerHTML = calendarSvg();
        calBtn2.addEventListener('mousedown', e => e.preventDefault());
        calBtn2.addEventListener('click', e => {
          e.preventDefault();
          openCalendarPopover(calBtn2, hiddenNative.value || null, iso => { hiddenNative.value = iso; hiddenNative.dispatchEvent(new Event('change')); });
        });
        wrapper.addEventListener('focusout', () => {
          setTimeout(() => { if (!wrapper.contains(document.activeElement)) commit(); }, 0);
        });
        wrapper.appendChild(input); wrapper.appendChild(calBtn2); wrapper.appendChild(hiddenNative);
        setTimeout(() => input.focus(), 0);
        return wrapper;
      }
      const span = document.createElement('span');
      const overdue = showOverdue && isOverdue(entity[field], entity.done);
      span.className = 'due-badge' + (overdue ? ' overdue' : '');
      if (entity[field]) {
        span.textContent = (overdue ? 'Overdue — ' : prefixLabel) + isoToDMY(entity[field]);
      } else if (printEmptyLabel !== undefined) {
        // The interactive prompt ("Set due date") only makes sense on screen; a static
        // PDF gets its own wording (or nothing at all, for sub-tasks) instead.
        const screenText = document.createElement('span'); screenText.className = 'due-screen-text'; screenText.textContent = emptyLabel;
        const printText = document.createElement('span'); printText.className = 'due-print-text'; printText.textContent = printEmptyLabel;
        span.appendChild(screenText); span.appendChild(printText);
      } else {
        span.textContent = emptyLabel;
      }
      span.addEventListener('click', () => { entity[editFlag] = true; renderList(); });
      return span;
    }

    function deleteSubNow(item, sub) {
      const idx = item.subs.findIndex(s => s.id === sub.id);
      const removed = item.subs[idx];
      item.subs = item.subs.filter(s => s.id !== sub.id);
      saveWorkspaces(); renderList();
      logActivity('delete', 'Deleted sub-task "' + removed.title + '"', ws.name);
      showUndoToast('Deleted "' + removed.title + '"', () => {
        item.subs.splice(idx, 0, removed); saveWorkspaces(); renderList();
        logActivity('undo', 'Undid delete of sub-task "' + removed.title + '"', ws.name);
      });
    }

    function buildSubEl(item, sub, subsIdx) {
      const li = document.createElement('li'); li.className = 'sub-item' + (sub.done ? ' done' : '');
      const row = document.createElement('div'); row.className = 'sub-item-row';

      const dragHandle = document.createElement('span');
      dragHandle.className = 'drag-handle sub'; dragHandle.setAttribute('aria-hidden', 'true'); dragHandle.textContent = '⠿';

      const moveWrap = document.createElement('div'); moveWrap.className = 'item-move sub';
      const upBtn = document.createElement('button');
      upBtn.type = 'button'; upBtn.className = 'move-btn'; upBtn.setAttribute('aria-label', 'Move sub-task up'); upBtn.textContent = '▲';
      upBtn.disabled = subsIdx <= 0;
      upBtn.addEventListener('click', () => moveSub(item, sub, -1));
      const downBtn = document.createElement('button');
      downBtn.type = 'button'; downBtn.className = 'move-btn'; downBtn.setAttribute('aria-label', 'Move sub-task down'); downBtn.textContent = '▼';
      downBtn.disabled = subsIdx >= item.subs.length - 1;
      downBtn.addEventListener('click', () => moveSub(item, sub, 1));
      moveWrap.appendChild(upBtn); moveWrap.appendChild(downBtn);

      const cb = document.createElement('button');
      cb.className = 'checkbox sub' + (sub.done ? ' done' : '');
      cb.setAttribute('aria-label', sub.done ? 'Mark sub-task incomplete' : 'Mark sub-task complete');
      cb.innerHTML = checkSvg();
      cb.addEventListener('click', () => {
        sub.done = !sub.done; syncItemStatus(item); saveWorkspaces(); renderList();
        logActivity('task', (sub.done ? 'Completed' : 'Reopened') + ' sub-task "' + sub.title + '"', ws.name);
      });

      const t = document.createElement('div');
      t.className = 'sub-title'; t.contentEditable = 'true'; t.textContent = sub.title;
      t.addEventListener('blur', () => {
        const oldTitle = sub.title;
        sub.title = t.textContent.trim() || sub.title; t.textContent = sub.title; saveWorkspaces();
        if (sub.title !== oldTitle) logActivity('text', 'Renamed sub-task "' + oldTitle + '" to "' + sub.title + '"', ws.name);
      });
      bindEnterToBlur(t); bindPasteAsPlainText(t);

      const del = document.createElement('button');
      del.className = 'sub-delete'; del.setAttribute('aria-label', 'Delete sub-task'); del.textContent = '×';
      del.addEventListener('click', () => requestDelete('Delete sub-task "' + sub.title + '"?', () => deleteSubNow(item, sub)));

      row.appendChild(dragHandle); row.appendChild(moveWrap); row.appendChild(cb); row.appendChild(t); row.appendChild(del);
      li.appendChild(row);

      const metaRow = document.createElement('div'); metaRow.className = 'sub-item-meta';
      const dueWrap = document.createElement('span');
      dueWrap.appendChild(buildDateControl(sub, 'due', '_editingDue', 'Due ', true, 'Set due date', ''));
      metaRow.appendChild(dueWrap);
      metaRow.appendChild(buildPrioritySelectFor(sub, true));
      li.appendChild(metaRow);
      li._dragHandle = dragHandle;
      return li;
    }

    function moveSub(item, sub, direction) {
      const idx = item.subs.indexOf(sub);
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= item.subs.length) return;
      const tmp = item.subs[idx]; item.subs[idx] = item.subs[targetIdx]; item.subs[targetIdx] = tmp;
      saveWorkspaces(); renderList();
    }

    function buildSubsEl(item) {
      const wrap = document.createElement('div'); wrap.className = 'subs';
      const ul = document.createElement('ul'); ul.className = 'sub-items';
      const liEls = item.subs.map((sub, idx) => buildSubEl(item, sub, idx));
      liEls.forEach(li => ul.appendChild(li));
      // Sub-tasks can only reorder within their own parent task's list — `liEls` here is
      // exactly that list, nothing from any other task, so bounds-clamping in
      // attachReorderDrag already keeps a sub-task from sliding out of its task.
      item.subs.forEach((sub, idx) => {
        attachReorderDrag(liEls[idx]._dragHandle, liEls[idx], liEls, idx, (fromIdx, toIdx) => {
          const [moved] = item.subs.splice(fromIdx, 1);
          item.subs.splice(toIdx, 0, moved);
          saveWorkspaces(); renderList();
        });
      });
      wrap.appendChild(ul);

      const addRow2 = document.createElement('div'); addRow2.className = 'add-sub-row';
      const input2 = document.createElement('input');
      input2.type = 'text'; input2.placeholder = 'Add a sub-task…'; input2.maxLength = 200; input2.autocomplete = 'off';
      const btn2 = document.createElement('button'); btn2.type = 'button'; btn2.textContent = '+';
      const addSub = () => {
        const val = input2.value.trim();
        if (!val) { input2.focus(); return; }
        item.subs.push({ id: uid(), title: val, done: false, due: null, priority: null });
        saveWorkspaces(); input2.value = ''; renderList();
        logActivity('task', 'Added sub-task "' + val + '"', ws.name);
      };
      btn2.addEventListener('click', addSub);
      input2.addEventListener('keydown', e => { if (e.key === 'Enter') addSub(); });
      addRow2.appendChild(input2); addRow2.appendChild(btn2);
      wrap.appendChild(addRow2);
      return wrap;
    }

    function buildPrioritySelectFor(entity, small) {
      const sel = document.createElement('select');
      sel.className = 'priority-screen-select styled-select';
      sel.setAttribute('aria-label', 'Priority');
      ['', 'low', 'medium', 'high'].forEach(v => {
        const opt = document.createElement('option'); opt.value = v; opt.textContent = v ? PRIORITY_TEXT[v] : 'No priority';
        if ((entity.priority || '') === v) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.title = 'Priority';
      sel.style.color = entity.priority ? 'var(--priority-' + entity.priority + ')' : 'var(--ink-soft)';
      sel.style.border = 'none'; sel.style.backgroundColor = 'transparent'; sel.style.font = 'inherit';
      sel.style.fontWeight = '600';
      sel.style.paddingTop = '0'; sel.style.paddingBottom = '0'; sel.style.paddingLeft = '0';
      if (small) sel.style.fontSize = '11px';
      sel.addEventListener('change', () => {
        entity.priority = sel.value || null; saveWorkspaces(); renderList();
        logActivity('task', 'Set priority of "' + entity.title + '" to ' + (entity.priority ? PRIORITY_TEXT[entity.priority] : 'none'), ws.name);
      });

      // A <select> renders as a live, editable form widget in the exported PDF rather
      // than plain text, so print output gets its own static label instead.
      const printText = document.createElement('span'); printText.className = 'priority-print-text';
      printText.style.color = entity.priority ? 'var(--priority-' + entity.priority + ')' : 'var(--ink-soft)';
      printText.style.fontWeight = '600';
      printText.textContent = entity.priority ? PRIORITY_TEXT[entity.priority] + ' priority' : 'No priority';

      const wrap = document.createElement('span'); wrap.className = 'priority-wrap';
      wrap.appendChild(sel); wrap.appendChild(printText);
      return wrap;
    }

    function buildItemEl(item, list) {
      const li = document.createElement('li'); li.className = 'item' + (item.done ? ' done' : '');
      const row = document.createElement('div'); row.className = 'item-row';

      const dragHandle = document.createElement('span');
      dragHandle.className = 'drag-handle'; dragHandle.setAttribute('aria-hidden', 'true'); dragHandle.textContent = '⠿';

      const idxInList = list.indexOf(item);
      const moveWrap = document.createElement('div'); moveWrap.className = 'item-move';
      const upBtn = document.createElement('button');
      upBtn.type = 'button'; upBtn.className = 'move-btn'; upBtn.setAttribute('aria-label', 'Move up'); upBtn.textContent = '▲';
      upBtn.disabled = idxInList <= 0;
      upBtn.addEventListener('click', () => moveItem(item, list, -1));
      const downBtn = document.createElement('button');
      downBtn.type = 'button'; downBtn.className = 'move-btn'; downBtn.setAttribute('aria-label', 'Move down'); downBtn.textContent = '▼';
      downBtn.disabled = idxInList >= list.length - 1;
      downBtn.addEventListener('click', () => moveItem(item, list, 1));
      moveWrap.appendChild(upBtn); moveWrap.appendChild(downBtn);

      const cb = document.createElement('button');
      cb.className = 'checkbox' + (item.done ? ' done' : '');
      cb.setAttribute('aria-label', item.done ? 'Mark incomplete' : 'Mark complete');
      cb.innerHTML = checkSvg();
      cb.addEventListener('click', () => {
        item.done = !item.done;
        if (item.done) { item.completedDate = todayIso(); }
        else { item.completedDate = null; item._editingCompleted = false; }
        syncItemStatus(item);
        saveWorkspaces(); renderList(); renderOverview();
        logActivity('task', (item.done ? 'Completed' : 'Reopened') + ' "' + item.title + '"', ws.name);
      });

      const body = document.createElement('div'); body.className = 'item-body';
      const t = document.createElement('div');
      t.className = 'item-title'; t.contentEditable = 'true'; t.textContent = item.title;
      t.addEventListener('blur', () => {
        const oldTitle = item.title;
        item.title = t.textContent.trim() || item.title; t.textContent = item.title; saveWorkspaces(); renderOverview();
        if (item.title !== oldTitle) logActivity('text', 'Renamed "' + oldTitle + '" to "' + item.title + '"', ws.name);
      });
      bindEnterToBlur(t); bindPasteAsPlainText(t);
      body.appendChild(t);

      const meta = document.createElement('div'); meta.className = 'item-meta';
      const dueWrap = document.createElement('span');
      dueWrap.appendChild(buildDateControl(item, 'due', '_editingDue', 'Due ', true, 'Set due date', 'No due date'));
      meta.appendChild(dueWrap);

      if (item.done) {
        const compWrap = document.createElement('span');
        compWrap.appendChild(buildDateControl(item, 'completedDate', '_editingCompleted', 'Completed ', false, 'Set completion date'));
        meta.appendChild(compWrap);
      }

      meta.appendChild(buildPrioritySelectFor(item, false));
      meta.appendChild(buildStoryPointsControl(item));
      if (ws.sprints.length > 0) meta.appendChild(buildSprintSelectFor(item));

      if (item.subs.length > 0) {
        const subCount = document.createElement('span'); subCount.className = 'sub-progress';
        const doneSubs = item.subs.filter(s => s.done).length;
        subCount.textContent = doneSubs + '/' + item.subs.length + ' sub-tasks';
        meta.appendChild(subCount);
      }
      body.appendChild(meta);

      const del = document.createElement('button');
      del.className = 'delete-btn'; del.setAttribute('aria-label', 'Delete task'); del.textContent = '×';
      del.addEventListener('click', () => requestDelete('Delete "' + item.title + '"?', () => deleteItemNow(item)));

      row.appendChild(dragHandle); row.appendChild(moveWrap); row.appendChild(cb); row.appendChild(body); row.appendChild(del);
      li.appendChild(row);
      li.appendChild(buildSubsEl(item));
      li._dragHandle = dragHandle;
      return li;
    }

    function deleteItemNow(item) {
      const idx = ws.items.findIndex(i => i.id === item.id);
      const removed = ws.items[idx];
      ws.items = ws.items.filter(i => i.id !== item.id);
      saveWorkspaces(); renderList(); renderOverview();
      logActivity('delete', 'Deleted "' + removed.title + '"', ws.name);
      showUndoToast('Deleted "' + removed.title + '"', () => {
        ws.items.splice(idx, 0, removed); saveWorkspaces(); renderList(); renderOverview();
        logActivity('undo', 'Undid delete of "' + removed.title + '"', ws.name);
      });
    }

    function commitItemReorder(list, item, fromIdx, toIdx) {
      if (fromIdx === toIdx) return;
      const targetSibling = list[toIdx];
      const absFrom = ws.items.indexOf(item);
      ws.items.splice(absFrom, 1);
      const absTarget = ws.items.indexOf(targetSibling);
      ws.items.splice(toIdx > fromIdx ? absTarget + 1 : absTarget, 0, item);
      saveWorkspaces(); renderList(); renderOverview();
    }

    function buildItemsList(list) {
      const ul = document.createElement('ul'); ul.className = 'items';
      const liEls = list.map(item => buildItemEl(item, list));
      liEls.forEach(li => ul.appendChild(li));
      // Wired in a second pass since the drag needs every sibling row's element up front
      // (for bounds-clamping and the live reorder preview), not just the one being dragged.
      list.forEach((item, idx) => {
        attachReorderDrag(liEls[idx]._dragHandle, liEls[idx], liEls, idx, (fromIdx, toIdx) => commitItemReorder(list, item, fromIdx, toIdx));
      });
      return ul;
    }

    function moveItem(item, list, direction) {
      const idx = list.indexOf(item);
      const target = list[idx + direction];
      if (!target) return;
      const aIdx = ws.items.indexOf(item);
      const bIdx = ws.items.indexOf(target);
      ws.items[aIdx] = target; ws.items[bIdx] = item;
      saveWorkspaces(); renderList(); renderOverview();
    }

    function renderList() {
      renderBoard();
      listContainer.innerHTML = '';
      const query = searchQuery;
      let source = ws.items;
      if (query) source = source.filter(i => i.title.toLowerCase().includes(query));
      if (priorityFilter) source = source.filter(i => priorityFilter === 'none' ? !i.priority : i.priority === priorityFilter);
      if (dateFilter) source = source.filter(i => computeBucket(i.due) === dateFilter);
      if (ws.activeSprintId === 'backlog') source = source.filter(i => !i.sprintId);
      else if (ws.activeSprintId !== 'all') source = source.filter(i => i.sprintId === ws.activeSprintId);

      if (ws.items.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state editable'; empty.setAttribute('data-key', 'emptyStateText'); empty.contentEditable = 'false';
        empty.textContent = labels.emptyStateText;
        bindEditable(empty);
        listContainer.appendChild(empty);
        updateProgress(); updateEditableState();
        return;
      }
      if (source.length === 0) {
        const noMatch = document.createElement('div'); noMatch.className = 'no-match-state';
        noMatch.textContent = query ? 'No tasks match "' + searchInput.value.trim() + '".' : 'No tasks match the current filters.';
        listContainer.appendChild(noMatch);
        updateProgress(); updateEditableState();
        return;
      }

      // Manual order (see the move up/down buttons) rather than an automatic sort, so
      // reordering has a visible, lasting effect. Priority/date narrow the list instead.
      const pending = source.filter(i => !i.done);
      const doneItems = source.filter(i => i.done);

      if (pending.length > 0) {
        const label = document.createElement('div');
        label.className = 'group-label editable'; label.setAttribute('data-key', 'pendingLabel'); label.contentEditable = 'false';
        label.textContent = labels.pendingLabel;
        bindEditable(label);
        listContainer.appendChild(label);
        listContainer.appendChild(buildItemsList(pending));
      }
      if (doneItems.length > 0) {
        const doneSection = document.createElement('div'); doneSection.className = 'done-section';
        const labelRow = document.createElement('div'); labelRow.className = 'group-label-row';
        const chevron = document.createElement('button');
        chevron.type = 'button'; chevron.className = 'collapse-chevron';
        chevron.setAttribute('aria-label', ws.completedCollapsed ? 'Expand completed' : 'Collapse completed');
        chevron.textContent = ws.completedCollapsed ? '▸' : '▾';
        chevron.addEventListener('click', () => { ws.completedCollapsed = !ws.completedCollapsed; saveWorkspaces(); renderList(); });
        labelRow.appendChild(chevron);
        const label = document.createElement('span');
        label.className = 'editable'; label.setAttribute('data-key', 'doneLabel'); label.contentEditable = 'false';
        label.textContent = labels.doneLabel;
        bindEditable(label);
        labelRow.appendChild(label);
        const count = document.createElement('span'); count.className = 'group-count'; count.textContent = '(' + doneItems.length + ')';
        labelRow.appendChild(count);
        doneSection.appendChild(labelRow);
        const doneList = buildItemsList(doneItems);
        if (ws.completedCollapsed) doneList.classList.add('collapsed-list');
        if (ws.completedCollapsed) doneList.style.display = 'none';
        doneSection.appendChild(doneList);
        listContainer.appendChild(doneSection);
      }
      updateProgress(); updateEditableState();
    }

    renderList();
    return panel;
  }

  // ---------- app-level render ----------
  function renderApp() {
    renderWorkspaceBar();
    const panelsContainer = document.getElementById('panelsContainer');
    panelsContainer.innerHTML = '';
    const activeWs = workspaces.filter(w => activeWorkspaceIds.includes(w.id));
    panelsContainer.classList.toggle('stretch', activeWs.length === 1 || activeWs.length === 2);
    if (activeWs.length === 0) {
      const empty = document.createElement('div'); empty.className = 'no-workspace-state';
      empty.textContent = 'No workspace open. Create one to get started.';
      panelsContainer.appendChild(empty);
    } else {
      activeWs.forEach(ws => { panelsContainer.appendChild(renderPanel(ws)); });
    }
    renderOverview();
    applyLabels();
    updateEditableState();

    if (pendingFocusWorkspaceId) {
      const target = panelsContainer.querySelector('.workspace-panel[data-ws-id="' + pendingFocusWorkspaceId + '"] .panel-title');
      if (target) selectAllContentEditable(target);
      pendingFocusWorkspaceId = null;
    }
  }

  // ---------- toolbar wiring ----------
  document.getElementById('customizeBtn').addEventListener('click', () => {
    customizing = !customizing;
    updateEditableState();
  });
  document.getElementById('resetTextBtn').addEventListener('click', () => {
    labels = Object.assign({}, DEFAULT_LABELS);
    saveLabels();
    renderApp();
  });
  // ---- Scrum PDF style: workspaces grouped by board status (To do / In progress / Done)
  // instead of pending/completed, with story points shown. Built fresh (not cloned) since
  // it has no on-screen equivalent view. ----
  function buildScrumPdfItemRow(item) {
    const li = document.createElement('li'); li.className = 'item' + (item.done ? ' done' : '');
    const row = document.createElement('div'); row.className = 'item-row';
    const body = document.createElement('div'); body.className = 'item-body';
    const title = document.createElement('div'); title.className = 'item-title'; title.textContent = item.title;
    body.appendChild(title);
    const meta = document.createElement('div'); meta.className = 'item-meta';
    const overdue = isOverdue(item.due, item.done);
    const due = document.createElement('span'); due.className = 'due-badge' + (overdue ? ' overdue' : '');
    due.textContent = item.due ? (overdue ? 'Overdue — ' : 'Due ') + isoToDMY(item.due) : 'No due date';
    meta.appendChild(due);
    const pr = document.createElement('span');
    pr.style.color = item.priority ? 'var(--priority-' + item.priority + ')' : 'var(--ink-soft)';
    pr.style.fontWeight = '600';
    pr.textContent = item.priority ? PRIORITY_TEXT[item.priority] + ' priority' : 'No priority';
    meta.appendChild(pr);
    if (item.storyPoints) {
      const pts = document.createElement('span'); pts.textContent = item.storyPoints + ' pts';
      meta.appendChild(pts);
    }
    body.appendChild(meta);
    row.appendChild(body);
    li.appendChild(row);
    return li;
  }
  function buildScrumPdfSection(ws) {
    const panel = document.createElement('div'); panel.className = 'workspace-panel';
    const h1 = document.createElement('h1'); h1.className = 'panel-title'; h1.textContent = ws.name;
    panel.appendChild(h1);
    const activeSprint = ws.sprints.find(s => s.id === ws.activeSprintId);
    if (ws.activeSprintId === 'backlog' || activeSprint) {
      const scopeNote = document.createElement('div'); scopeNote.className = 'sprint-info';
      scopeNote.textContent = activeSprint ? 'Sprint: ' + activeSprint.name : 'Backlog (no sprint)';
      panel.appendChild(scopeNote);
    }
    let source = ws.items;
    if (ws.activeSprintId === 'backlog') source = source.filter(i => !i.sprintId);
    else if (ws.activeSprintId !== 'all') source = source.filter(i => i.sprintId === ws.activeSprintId);
    let any = false;
    STATUSES.forEach(status => {
      const items = source.filter(i => i.status === status);
      if (items.length === 0) return;
      any = true;
      const label = document.createElement('div'); label.className = 'group-label-row';
      const span = document.createElement('span'); span.textContent = labels[STATUS_LABEL_KEY[status]];
      label.appendChild(span);
      panel.appendChild(label);
      const ul = document.createElement('ul'); ul.className = 'items';
      items.forEach(item => ul.appendChild(buildScrumPdfItemRow(item)));
      panel.appendChild(ul);
    });
    if (!any) {
      const empty = document.createElement('div'); empty.className = 'empty-state'; empty.textContent = 'Nothing tracked yet.';
      panel.appendChild(empty);
    }
    return panel;
  }
  function buildPdfScrumContent(container) {
    container.innerHTML = '';
    workspaces.filter(w => activeWorkspaceIds.includes(w.id)).forEach(ws => {
      container.appendChild(buildScrumPdfSection(ws));
    });
  }

  // Preview shows what will be saved; the actual save goes straight to a native
  // save-location dialog and a dialog-less WebKit print-to-file — no OS print dialog.
  let pdfStyle = 'list';
  const pdfScrumContent = document.getElementById('pdfScrumContent');
  async function exportPdf() {
    let path;
    try {
      path = await invoke('plugin:dialog|save', {
        options: {
          title: 'Save as PDF',
          defaultPath: 'task-tracker-' + isoToDMY(todayIso()) + '.pdf',
          filters: [{ name: 'PDF', extensions: ['pdf'] }]
        }
      });
    } catch (e) { console.error('Save dialog failed', e); window.alert('Could not open the save dialog.'); return; }
    if (!path) return;
    if (pdfStyle === 'scrum') buildPdfScrumContent(pdfScrumContent);
    document.body.classList.toggle('pdf-style-scrum', pdfStyle === 'scrum');
    try {
      await invoke('export_pdf', { path: path });
      closePrintPreview();
    } catch (e) { console.error('Failed to export PDF', e); window.alert('Could not save the PDF.'); }
  }

  const printPreviewOverlay = document.getElementById('printPreviewOverlay');
  const printPreviewContent = document.getElementById('printPreviewContent');
  const pdfStyleListBtn = document.getElementById('pdfStyleListBtn');
  const pdfStyleScrumBtn = document.getElementById('pdfStyleScrumBtn');
  const pdfSprintSelect = document.getElementById('pdfSprintSelect');

  // Sprint names, deduped, across every workspace currently open in the preview — selecting
  // one applies it (by name) to each of those workspaces so the preview (and the real board/
  // list behind it) update live, without needing a separate "preview-only" filter to track.
  function populatePdfSprintSelect() {
    const activeWs = workspaces.filter(w => activeWorkspaceIds.includes(w.id));
    const sprintNames = [];
    activeWs.forEach(w => w.sprints.forEach(s => { if (sprintNames.indexOf(s.name) === -1) sprintNames.push(s.name); }));
    if (sprintNames.length === 0) { pdfSprintSelect.style.display = 'none'; pdfSprintSelect.innerHTML = ''; return; }
    pdfSprintSelect.style.display = '';
    pdfSprintSelect.innerHTML = '';
    [['all', 'All tasks'], ['backlog', 'Backlog']].concat(sprintNames.map(n => [n, n])).forEach(pair => {
      const opt = document.createElement('option'); opt.value = pair[0]; opt.textContent = pair[1];
      pdfSprintSelect.appendChild(opt);
    });
    const firstWs = activeWs[0];
    let current = 'all';
    if (firstWs) {
      if (firstWs.activeSprintId === 'backlog') current = 'backlog';
      else if (firstWs.activeSprintId !== 'all') {
        const s = firstWs.sprints.find(s => s.id === firstWs.activeSprintId);
        if (s) current = s.name;
      }
    }
    pdfSprintSelect.value = current;
  }
  function applyPdfSprintSelection(value) {
    workspaces.filter(w => activeWorkspaceIds.includes(w.id)).forEach(w => {
      if (value === 'all') w.activeSprintId = 'all';
      else if (value === 'backlog') w.activeSprintId = 'backlog';
      else { const match = w.sprints.find(s => s.name === value); w.activeSprintId = match ? match.id : 'all'; }
    });
    saveWorkspaces();
    renderApp();
  }
  pdfSprintSelect.addEventListener('change', () => {
    applyPdfSprintSelection(pdfSprintSelect.value);
    renderPrintPreviewContent();
  });

  function renderPrintPreviewContent() {
    printPreviewContent.innerHTML = '';
    if (pdfStyle === 'scrum') {
      buildPdfScrumContent(printPreviewContent);
    } else {
      document.querySelectorAll('#panelsContainer .workspace-panel').forEach(panel => {
        printPreviewContent.appendChild(panel.cloneNode(true));
      });
    }
    printPreviewContent.classList.toggle('hide-completed-print', !includeCompletedToggle.checked);
    pdfStyleListBtn.classList.toggle('active', pdfStyle === 'list');
    pdfStyleScrumBtn.classList.toggle('active', pdfStyle === 'scrum');
    populatePdfSprintSelect();
  }
  pdfStyleListBtn.addEventListener('click', () => { pdfStyle = 'list'; renderPrintPreviewContent(); });
  pdfStyleScrumBtn.addEventListener('click', () => { pdfStyle = 'scrum'; renderPrintPreviewContent(); });
  function openPrintPreview() {
    renderPrintPreviewContent();
    printPreviewOverlay.style.display = 'flex';
  }
  function closePrintPreview() { printPreviewOverlay.style.display = 'none'; }
  document.getElementById('exportBtn').addEventListener('click', openPrintPreview);
  document.getElementById('printPreviewCloseBtn').addEventListener('click', closePrintPreview);
  document.getElementById('printPreviewSaveBtn').addEventListener('click', exportPdf);
  printPreviewOverlay.addEventListener('click', e => { if (e.target === printPreviewOverlay) closePrintPreview(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && printPreviewOverlay.style.display !== 'none') closePrintPreview();
  });

  // ---- sprint create/edit modal (shared across all open workspace panels) ----
  let sprintModalTarget = null;
  const sprintModalOverlay = document.getElementById('sprintModalOverlay');
  const sprintModalTitle = document.getElementById('sprintModalTitle');
  const sprintNameInput = document.getElementById('sprintNameInput');
  const sprintGoalInput = document.getElementById('sprintGoalInput');
  const sprintStartSlot = document.getElementById('sprintStartSlot');
  const sprintEndSlot = document.getElementById('sprintEndSlot');
  let sprintStartField = null, sprintEndField = null;

  function openSprintModal(ws, sprint, onSaved) {
    sprintModalTarget = { ws: ws, sprint: sprint, onSaved: onSaved };
    sprintModalTitle.textContent = sprint ? 'Edit sprint' : 'New sprint';
    sprintNameInput.value = sprint ? sprint.name : '';
    sprintGoalInput.value = sprint ? sprint.goal : '';
    sprintStartSlot.innerHTML = ''; sprintEndSlot.innerHTML = '';
    sprintStartField = buildDateField(sprint ? sprint.startDate : null);
    sprintEndField = buildDateField(sprint ? sprint.endDate : null);
    sprintStartSlot.appendChild(sprintStartField.el);
    sprintEndSlot.appendChild(sprintEndField.el);
    sprintModalOverlay.style.display = 'flex';
    setTimeout(() => sprintNameInput.focus(), 0);
  }
  function closeSprintModal() { sprintModalOverlay.style.display = 'none'; sprintModalTarget = null; }
  document.getElementById('sprintCancelBtn').addEventListener('click', closeSprintModal);
  document.getElementById('sprintSaveBtn').addEventListener('click', () => {
    if (!sprintModalTarget) return;
    const name = sprintNameInput.value.trim();
    if (!name) { sprintNameInput.focus(); return; }
    const ws = sprintModalTarget.ws, sprint = sprintModalTarget.sprint, onSaved = sprintModalTarget.onSaved;
    if (sprint) {
      const oldName = sprint.name, oldGoal = sprint.goal;
      sprint.name = name; sprint.goal = sprintGoalInput.value.trim();
      sprint.startDate = sprintStartField.getIso(); sprint.endDate = sprintEndField.getIso();
      saveWorkspaces();
      if (sprint.name !== oldName) logActivity('text', 'Renamed sprint "' + oldName + '" to "' + sprint.name + '"', ws.name);
      if (sprint.goal !== oldGoal) {
        logActivity('text', sprint.goal
          ? 'Set goal of sprint "' + sprint.name + '" to "' + sprint.goal + '"'
          : 'Cleared goal of sprint "' + sprint.name + '"', ws.name);
      }
    } else {
      ws.sprints.push({ id: uid(), name: name, goal: sprintGoalInput.value.trim(), startDate: sprintStartField.getIso(), endDate: sprintEndField.getIso() });
      saveWorkspaces();
      logActivity('task', 'Created sprint "' + name + '"', ws.name);
    }
    closeSprintModal();
    onSaved();
  });
  sprintModalOverlay.addEventListener('click', e => { if (e.target === sprintModalOverlay) closeSprintModal(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && sprintModalOverlay.style.display !== 'none') closeSprintModal();
  });

  // ---- sprint management (rename/delete), independent of the sprint bar's current filter ----
  const sprintManageOverlay = document.getElementById('sprintManageOverlay');
  const sprintManageList = document.getElementById('sprintManageList');
  let sprintManageOnChange = null;

  function renderSprintManageList(ws) {
    sprintManageList.innerHTML = '';
    if (ws.sprints.length === 0) {
      const empty = document.createElement('div'); empty.className = 'sprint-manage-empty'; empty.textContent = 'No sprints yet.';
      sprintManageList.appendChild(empty);
      return;
    }
    ws.sprints.forEach(sprint => {
      const row = document.createElement('div'); row.className = 'sprint-manage-row';
      const info = document.createElement('div'); info.className = 'sprint-manage-row-info';
      const name = document.createElement('div'); name.className = 'sprint-manage-row-name'; name.textContent = sprint.name;
      info.appendChild(name);
      if (sprint.startDate || sprint.endDate || sprint.goal) {
        const sub = document.createElement('div'); sub.className = 'sprint-manage-row-sub';
        let text = '';
        if (sprint.startDate || sprint.endDate) text += (sprint.startDate ? isoToDMY(sprint.startDate) : '?') + ' – ' + (sprint.endDate ? isoToDMY(sprint.endDate) : '?');
        if (sprint.goal) text += (text ? ' · ' : '') + sprint.goal;
        sub.textContent = text;
        info.appendChild(sub);
      }
      row.appendChild(info);

      const actions = document.createElement('div'); actions.className = 'sprint-manage-row-actions';
      const renameBtn = document.createElement('button'); renameBtn.type = 'button'; renameBtn.className = 'chip-btn'; renameBtn.textContent = 'Rename';
      renameBtn.addEventListener('click', () => {
        openSprintModal(ws, sprint, () => {
          renderSprintManageList(ws);
          if (sprintManageOnChange) sprintManageOnChange();
        });
      });
      const deleteBtn = document.createElement('button'); deleteBtn.type = 'button'; deleteBtn.className = 'chip-btn'; deleteBtn.textContent = 'Delete';
      deleteBtn.addEventListener('click', () => {
        const ok = window.confirm('Delete sprint "' + sprint.name + '"? Its tasks move back to the backlog.');
        if (!ok) return;
        ws.items.forEach(i => { if (i.sprintId === sprint.id) i.sprintId = null; });
        ws.sprints = ws.sprints.filter(s => s.id !== sprint.id);
        if (ws.activeSprintId === sprint.id) ws.activeSprintId = 'all';
        saveWorkspaces();
        logActivity('delete', 'Deleted sprint "' + sprint.name + '" (tasks moved to backlog)', ws.name);
        renderSprintManageList(ws);
        if (sprintManageOnChange) sprintManageOnChange();
      });
      actions.appendChild(renameBtn); actions.appendChild(deleteBtn);
      row.appendChild(actions);
      sprintManageList.appendChild(row);
    });
  }
  function openSprintManageModal(ws, onChange) {
    sprintManageOnChange = onChange;
    renderSprintManageList(ws);
    document.getElementById('sprintManageNewBtn').onclick = () => {
      openSprintModal(ws, null, () => {
        renderSprintManageList(ws);
        if (sprintManageOnChange) sprintManageOnChange();
      });
    };
    sprintManageOverlay.style.display = 'flex';
  }
  function closeSprintManageModal() { sprintManageOverlay.style.display = 'none'; }
  document.getElementById('sprintManageCloseBtn').addEventListener('click', closeSprintManageModal);
  sprintManageOverlay.addEventListener('click', e => { if (e.target === sprintManageOverlay) closeSprintManageModal(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && sprintManageOverlay.style.display !== 'none') closeSprintManageModal();
  });

  document.getElementById('exportBackupBtn').addEventListener('click', exportBackup);
  document.getElementById('importBackupBtn').addEventListener('click', importBackup);

  const includeCompletedToggle = document.getElementById('includeCompletedToggle');
  includeCompletedToggle.addEventListener('change', () => {
    document.body.classList.toggle('hide-completed-print', !includeCompletedToggle.checked);
    saveExportPrefs(includeCompletedToggle.checked);
  });

  const confirmDeleteToggle = document.getElementById('confirmDeleteToggle');
  confirmDeleteToggle.addEventListener('change', () => {
    confirmBeforeDelete = confirmDeleteToggle.checked;
    saveDeleteConfirmPref();
  });

  document.getElementById('deleteConfirmCancelBtn').addEventListener('click', () => {
    document.getElementById('deleteConfirmOverlay').style.display = 'none';
    deleteConfirmTarget = null;
  });
  document.getElementById('deleteConfirmOkBtn').addEventListener('click', () => {
    if (!deleteConfirmTarget) return;
    if (document.getElementById('deleteConfirmDontAskAgain').checked) {
      confirmBeforeDelete = false; saveDeleteConfirmPref(); confirmDeleteToggle.checked = false;
    }
    const cb = deleteConfirmTarget;
    deleteConfirmTarget = null;
    document.getElementById('deleteConfirmOverlay').style.display = 'none';
    cb();
  });
  document.getElementById('deleteConfirmOverlay').addEventListener('click', e => {
    if (e.target.id === 'deleteConfirmOverlay') { e.target.style.display = 'none'; deleteConfirmTarget = null; }
  });
  document.addEventListener('keydown', e => {
    const overlay = document.getElementById('deleteConfirmOverlay');
    if (e.key === 'Escape' && overlay.style.display !== 'none') { overlay.style.display = 'none'; deleteConfirmTarget = null; }
  });

  const themeToggle = document.getElementById('themeToggle');
  async function applyStoredTheme() {
    let theme;
    try { theme = await storeGet(THEME_KEY); } catch (e) {}
    if (theme === 'dark' || theme === 'light') {
      document.documentElement.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'dark' ? 'Light' : 'Dark';
    }
  }
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const currentlyDark = current === 'dark' || (!current && prefersDark);
    const next = currentlyDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    themeToggle.textContent = next === 'dark' ? 'Light' : 'Dark';
    storeSet(THEME_KEY, next);
  });

  document.querySelectorAll('.editable[data-key]').forEach(bindEditable);

  document.getElementById('overviewTabBtn').addEventListener('click', () => { sidebarTab = 'overview'; updateSidebarTabs(); });
  document.getElementById('changesTabBtn').addEventListener('click', () => { sidebarTab = 'changes'; updateSidebarTabs(); renderChangesList(); });
  document.getElementById('changesFilterSelect').addEventListener('change', renderChangesList);
  updateSidebarTabs();

  (async function boot() {
    await initStore();
    await applyStoredTheme();
    includeCompletedToggle.checked = await loadExportPrefs();
    document.body.classList.toggle('hide-completed-print', !includeCompletedToggle.checked);
    await loadLabels();
    await loadWorkspaces();
    await loadActivityLog();
    await loadDeleteConfirmPref();
    confirmDeleteToggle.checked = confirmBeforeDelete;
    renderApp();
    renderChangesList();
  })();
})();
</script>
</body>
</html>
